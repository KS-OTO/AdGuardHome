name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26.8'
  NODE_VERSION: '24'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Reuse the upstream build pipeline (scripts/make/build-release.sh):
      # it builds the client_v2 frontend, injects the version/channel into
      # the binaries.  pack-release then archives all platforms into dist/
      # and generates checksums.txt and version.json.
      - name: Build release
        run: |
          make \
            SIGN=0 \
            VERBOSE=1 \
            VERSION="${GITHUB_REF_NAME}" \
            CHANNEL='release' \
            build-release \
            pack-release \
            ;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/version.json
